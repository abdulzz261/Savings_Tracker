<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portofolio Developer</title>
  
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- SCRIPT UPGRADE: MENCEGAH FLASH TEMA & FLICKER DESKTOP -->
  <script>
    (function() {
      // 1. Kunci Tema Langsung Pas Loading
      if (localStorage.getItem('portfolio-theme') === 'light') {
        document.documentElement.classList.add('light-theme');
      }
      // 2. Kunci Layar Laptop Pas Loading (Biar Gak Flicker UI HP)
      if (window.innerWidth >= 992) {
        document.documentElement.classList.add('is-desktop');
      }
    })();
  </script>
</head>
<body class="preload dark-theme">

  <!-- Navbar Fixed / Sticky -->
<!-- STRUKTUR NAVBAR HTML YANG BENAR -->
<!-- STRUKTUR NAVBAR UTAMA (STANDAR & AMAN SE-DUNIA) -->
<nav class="navbar">
  <div class="logo">MY PORTFOLIO</div>

  <div class="nav-right">
    <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
      <i class="fa-solid fa-moon"></i>
    </button>
    <button id="menu-toggle" class="menu-btn" aria-label="Toggle Menu">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>

  <ul id="nav-links" class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="skills.html">Skills</a></li>
    <li><a href="projects.html">Projects</a></li>
    <li><a href="contact.html" class="active">Contact</a></li>
  </ul>
</nav>

  <!-- Container Utama -->
  <main class="container">
    <h2 class="section-title">Hubungi Saya</h2>
    
    <div class="contact-wrapper">
      
      <!-- OPSI SALIN EMAIL LANGSUNG -->
      <div class="direct-contact-box">
        <p>Ingin kirim email langsung lewat aplikasi bawaan HP/PC kamu?</p>
        <button type="button" class="btn secondary btn-copy-email" onclick="copyEmailToClipboard('abdullahraoulvan@gmail.com')">
          <i class="fa-solid fa-copy"></i> Contact via Email
        </button>
      </div>

      <div class="divider"><span>Atau kirim pesan langsung</span></div>

      <!-- FORMULIR PESAN (Punya id="contact-form" & id="submit-btn") -->
      <form class="contact-form" id="contact-form">
        <!-- MASUKKAN ACCESS KEY WEB3FORMS KAMU DI SINI -->
        <input type="hidden" name="access_key" value="a2abd8b5-61cc-4c81-ae99-c959624ddd13">
        <input type="hidden" name="subject" value="Pesan Baru dari Web Portofolio">

        <div class="form-group">
          <label for="name">Nama</label>
          <input type="text" id="name" name="name" placeholder="Nama kamu..." required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Email kamu..." required>
        </div>

        <div class="form-group">
          <label for="message">Pesan</label>
          <textarea id="message" name="message" rows="4" placeholder="Tulis pesan kamu..." required></textarea>
        </div>

        <button type="submit" class="btn primary btn-full" id="submit-btn">Kirim Pesan</button>
      </form>

    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Raoul Van Abdullah Portfolio. Built with ❤️</p>
  </footer>
  <script src="script.js"></script>

 <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="custom-modal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-icon">
      <i class="fa-solid fa-circle-check"></i>
    </div>
    <h3 id="modal-title">Berhasil!</h3>
    <p id="modal-desc">Pesan kamu berhasil terkirim 🚀</p>
    <button type="button" class="btn primary btn-full" onclick="closeModal()">Tutup</button>
  </div>
  </div>

</body>
</html>
