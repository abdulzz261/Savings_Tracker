<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Target Nabung</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #eef2f6 0%, #e2e8f0 100%);
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem 1rem;
    }

    .card {
      background-color: #ffffff;
      padding: 2.25rem 2rem;
      border-radius: 24px;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.07);
      border: 1px solid #e2e8f0;
      width: 100%;
      max-width: 440px;
    }

    .card-header {
      text-align: center;
      margin-bottom: 1.25rem;
    }

    .level-tag {
      display: inline-block;
      background-color: #e0e7ff;
      color: #3730a3;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .card-header h2 {
      margin: 0;
      color: #0f172a;
      font-size: 1.5rem;
      font-weight: 800;
    }

    .card-header p {
      margin: 6px 0 0 0;
      color: #64748b;
      font-size: 0.875rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      font-weight: 600;
      font-size: 0.875rem;
      color: #334155;
    }

    input, select {
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background-color: #ffffff;
      color: #0f172a;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      width: 100%;
      margin-top: 4px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
    }

    .calc-box {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 12px 16px;
      margin-top: 0.2rem;
    }

    .calc-title {
      font-size: 0.75rem;
      font-weight: 800;
      color: #166534;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .calc-desc {
      font-size: 0.85rem;
      color: #15803d;
      line-height: 1.4;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    button {
      padding: 14px 16px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      background-color: #10b981;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
      margin-top: 10px;
      width: 100%;
      animation: fadeUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s ease;
    }

    button:hover { background-color: #059669; }
    button:active { transform: translateY(1px) scale(0.97); }

    /* Modal Overlay & Box */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(6px);
      display: flex; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
      z-index: 999; padding: 1rem;
    }

    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box { background: #ffffff; padding: 2rem; border-radius: 24px; max-width: 400px; width: 100%; text-align: center; }
    .modal-overlay.active .modal-box { animation: fadeUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .modal-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .modal-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 0.5rem; }
    .modal-desc { font-size: 0.9rem; color: #64748b; margin-bottom: 1.25rem; text-align: left; }

    .saving-summary-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 1.25rem;
      text-align: left;
      font-size: 0.85rem;
      line-height: 1.7;
    }

    .saving-summary-box div span { font-weight: 700; color: #0f172a; }

    .modal-actions { display: flex; flex-direction: column; gap: 8px; }
    .btn-modal-continue { background-color: #10b981; color: #ffffff; margin-top: 0; }
    .btn-modal-reset { background-color: #f1f5f9; color: #64748b; box-shadow: none; margin-top: 0; }
    .btn-modal-reset:hover { background-color: #e2e8f0; color: #0f172a; }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <span class="level-tag">PEMBUATAN TARGET</span>
      <h2>🎯 Target Nabung</h2>
      <p>Atur target dan estimasi tabunganmu</p>
    </div>

    <form id="setupForm" onsubmit="handleSetupSubmit(event)">
      <div class="input-group">
        <div>
          <label for="goal-name">Nama Tabungan</label>
          <input type="text" id="goal-name" required placeholder="Contoh: Beli Laptop Asus ROG">
        </div>

        <div>
          <label for="target-amount">Target Utama Tabungan</label>
          <input type="text" id="target-amount" required placeholder="Rp 500.000">
        </div>

        <div class="grid-2">
          <div>
            <label for="period-amount">Nominal Nabung</label>
            <input type="text" id="period-amount" placeholder="Rp 20.000">
          </div>
          <div>
            <label for="frequency">Frekuensi</label>
            <select id="frequency">
              <option value="hari">Per Hari</option>
              <option value="minggu">Per Minggu</option>
              <option value="bulan">Per Bulan</option>
            </select>
          </div>
        </div>

        <div class="calc-box">
          <div class="calc-title">Kalkulator Estimasi</div>
          <div id="calcText" class="calc-desc">Masukkan target & nominal nabung untuk melihat estimasi waktu.</div>
        </div>

        <button type="submit">Mulai Menabung</button>
      </div>
    </form>
  </div>

  <!-- POPUP MELANJUTKAN TABUNGAN -->
  <div class="modal-overlay" id="app-modal">
    <div class="modal-box">
      <div class="modal-icon" id="modal-icon">🏦</div>
      <h3 class="modal-title" id="modal-title">Lanjutkan Tabungan?</h3>
      <p style="text-align: center; color: #64748b; font-size: 0.85rem; margin-bottom: 12px;">Kamu masih memiliki tabungan aktif yang tersimpan:</p>

      <div class="saving-summary-box" id="saving-summary">
        <!-- Rincian diisi otomatis via JS -->
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-modal-continue" onclick="goToDashboard()">LANJUTKAN TABUNGAN</button>
        <button type="button" class="btn-modal-reset" onclick="startNewGoal()">Buat Target Baru</button>
      </div>
    </div>
  </div>

  <script>
    const targetInput = document.getElementById('target-amount');
    const periodInput = document.getElementById('period-amount');
    const freqInput = document.getElementById('frequency');
    const modalEl = document.getElementById('app-modal');

    function formatRupiah(angka) {
      return 'Rp ' + Number(angka).toLocaleString('id-ID');
    }

    function formatInputRupiah(angka) {
      let number_string = angka.replace(/[^,\d]/g, '').toString();
      let split   = number_string.split(',');
      let sisa    = split[0].length % 3;
      let rupiah  = split[0].substr(0, sisa);
      let ribuan  = split[0].substr(sisa).match(/\d{3}/gi);

      if (ribuan) {
        let separator = sisa ? '.' : '';
        rupiah += separator + ribuan.join('.');
      }

      rupiah = split[1] != undefined ? rupiah + ',' + split[1] : rupiah;
      return rupiah ? 'Rp ' + rupiah : '';
    }

    function parseRawNumber(str) {
      if (!str) return 0;
      return parseFloat(str.replace(/[^0-9]/g, '')) || 0;
    }

    [targetInput, periodInput].forEach(el => {
      el.addEventListener('keyup', function() {
        this.value = formatInputRupiah(this.value);
        updateCalculator();
      });
    });

    freqInput.addEventListener('change', updateCalculator);

    function updateCalculator() {
      const target = parseRawNumber(targetInput.value);
      const period = parseRawNumber(periodInput.value);
      const freq = freqInput.value;
      const calcText = document.getElementById('calcText');

      if (target > 0 && period > 0) {
        const timeNeeded = Math.ceil(target / period);
        calcText.innerHTML = `Dibutuhkan sekitar <b>${timeNeeded} ${freq}</b> untuk mencapai target nominal Anda.`;
      } else {
        calcText.innerText = 'Masukkan target & nominal nabung untuk melihat estimasi waktu.';
      }
    }

    function getLevelText(percentage) {
      if (percentage >= 100) return 'LEVEL MAX (100%)';
      if (percentage >= 80) return 'LEVEL 5 (80%)';
      if (percentage >= 60) return 'LEVEL 4 (60%)';
      if (percentage >= 40) return 'LEVEL 3 (40%)';
      if (percentage >= 20) return 'LEVEL 2 (20%)';
      return 'LEVEL 1 (0%)';
    }

    // CEK DATA TABUNGAN SAAT HALAMAN DIBUKA
    window.onload = function() {
      const savedGoalName = localStorage.getItem('rdpu_goal_name');
      const savedTarget = parseFloat(localStorage.getItem('rdpu_target_custom'));
      const savedSaldo = parseFloat(localStorage.getItem('rdpu_saldo')) || 0;

      if (savedGoalName && savedTarget) {
        let percent = ((savedSaldo / savedTarget) * 100).toFixed(1);
        if (percent > 100) percent = 100;
        const levelStr = getLevelText(percent);

        document.getElementById('saving-summary').innerHTML = `
          <div>Nama Tabungan: <span>${savedGoalName}</span></div>
          <div>Level Pencapaian: <span style="color:#3730a3;">${levelStr}</span></div>
          <div>Saldo Terkumpul: <span style="color:#10b981;">${formatRupiah(savedSaldo)}</span></div>
          <div>Target Utama: <span>${formatRupiah(savedTarget)}</span> (${percent}%)</div>
        `;

        modalEl.classList.add('active');
      }
    };

    function goToDashboard() {
      window.location.replace('/dashboard');
    }

    function startNewGoal() {
      localStorage.clear();
      modalEl.classList.remove('active');
    }

    function handleSetupSubmit(e) {
      e.preventDefault();
      const goalName = document.getElementById('goal-name').value;
      const targetVal = parseRawNumber(targetInput.value);

      if (targetVal <= 0) {
        alert('Harap masukkan nominal target yang lebih besar dari Rp 0.');
        return;
      }

      localStorage.setItem('rdpu_goal_name', goalName);
      localStorage.setItem('rdpu_target_custom', targetVal);
      localStorage.setItem('rdpu_saldo', 0);
      localStorage.setItem('rdpu_history', JSON.stringify([]));

      window.location.replace('/dashboard');
    }
  </script>
</body>
</html>
